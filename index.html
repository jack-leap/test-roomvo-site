<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Platform</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" 
        src="https://cdn.roomvo.com/static/scripts/b2b/demo_company.js" async>
    </script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="index.html?roomvoStartVisualizer=true">visualizer</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="content">
            <h1>Welcome to Our E-commerce Platform</h1>
        </section>
        <section id="visualizerArea">
            <!-- 800 × 600 iframe -->
            <iframe
                id="visualizerFrame"
                width="800"
                height="600"
                src=""
                style="border:0;">
            </iframe>

            <!-- Button to load the visualizer URL into the iframe -->
            <button
                id="openVisualizerBtn"
                type="button"
                onclick="document.getElementById('visualizerFrame').src='index.html?roomvoStartVisualizer=true';">
                Open Visualizer
            </button>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 E-commerce Platform. All Rights Reserved.</p>
    </footer>
</body>
</html>
